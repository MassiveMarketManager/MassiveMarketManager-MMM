name: Backend CI

on:
  push:
    branches: [ "feature/backend" ]
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]
  pull_request:
    branches: [ "feature/backend", "dev", "hotfix-*", "main" ]
    # No paths filter: build_test_coverage is a required check and must report on every PR.
    # The changes job skips the build when backend/ is untouched; a skipped job counts as passed.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/massivemarketmanager/massivemarketmanager-backend

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    defaults:
      run:
        working-directory: .
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if grep -qE '^(backend/|\.github/workflows/backend-ci\.yml$)' <<< "$files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  build_test_coverage:
    needs: changes
    # Runs unless the changes job explicitly found no backend changes,
    # so a failure in change detection never turns into a silently skipped (= passed) check.
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build & test
        run: mvn -B -U clean verify

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**

      - name: Upload JaCoCo report
        if: ${{ hashFiles('backend/target/site/jacoco/jacoco.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            backend/target/site/jacoco/**
            backend/target/jacoco.exec

      - name: Coverage Summary (Markdown)
        if: ${{ hashFiles('backend/target/site/jacoco/jacoco.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/target/site/jacoco/jacoco.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_complexity: true
          output: both

  docker:
    name: Docker build & push (GHCR)
    runs-on: ubuntu-latest
    needs: build_test_coverage
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/backend')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:feature-backend
